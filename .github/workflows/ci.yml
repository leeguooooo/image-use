name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # The CLI is stdlib-only — no install step, nothing to pip.
      - name: Byte-compile the CLI
        run: python -m py_compile image-use chatgpt-imagegen
      - name: Run unit tests
        run: |
          python -m unittest test_image_use -v
          python -m unittest discover -s tests -p test_release_source.py -v
      - name: Test install.sh
        run: sh tests/install.test.sh

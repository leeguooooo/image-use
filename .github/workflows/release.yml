name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - id: check
        shell: python
        run: |
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          run = event.get("workflow_run", {})
          manual = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          eligible = (os.environ.get("GITHUB_REF") == "refs/heads/main") if manual else (
              run.get("event") == "push" and run.get("conclusion") == "success"
              and run.get("head_branch") == "main"
              and run.get("head_repository", {}).get("full_name") == os.environ["GITHUB_REPOSITORY"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"eligible={str(eligible).lower()}", file=output)
  release:
    needs: candidate
    if: needs.candidate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Verify trusted release source
        id: source
        run: python3 scripts/validate-release-source.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify matching release versions
        id: version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          cli = Path("image-use").read_text(encoding="utf-8")
          skill = Path("skills/image-use/SKILL.md").read_text(encoding="utf-8")
          if Path("image-use").read_bytes() != Path("skills/image-use/image-use").read_bytes():
              raise SystemExit("bundled Skill CLI differs from canonical image-use")
          cli_match = re.search(r'^__version__\s*=\s*"([\d.]+)"', cli, re.MULTILINE)
          skill_match = re.search(r'^version:\s*"([\d.]+)"', skill, re.MULTILINE)
          if not cli_match or not skill_match:
              raise SystemExit("could not read versions from image-use and SKILL.md")
          cli_version = cli_match.group(1)
          skill_version = skill_match.group(1)
          if cli_version != skill_version:
              raise SystemExit(
                  f"version mismatch: CLI={cli_version}, SKILL.md={skill_version}")
          if not re.search(rf'^# WHATSNEW\[{re.escape(cli_version)}\]:\s*\S',
                           cli, re.MULTILINE):
              raise SystemExit(f"missing WHATSNEW entry for {cli_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={cli_version}", file=output)

      - name: Check whether the version is already released
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the release candidate
        if: steps.tag.outputs.exists == 'false'
        run: |
          python -m py_compile image-use chatgpt-imagegen
          python -m unittest test_image_use -v

      - name: Create tag and GitHub Release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
        # Notes come from the repo (WHATSNEW line, commits, contributors):
        # --generate-notes only lists merged PRs, and most releases here are
        # direct pushes, which left a bare "Full Changelog" link.
        run: |
          python scripts/release-notes.py "$VERSION" "$TARGET_SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
